  <circle cx="1118" cy="432" r="252" fill="none" stroke="#0a0e16" stroke-width="38" opacity=".95" filter="url(#shadow)"/>
  <circle cx="1118" cy="432" r="245" fill="none" stroke="#aeb8ca" stroke-width="8" opacity=".7"/>
  <g transform="translate(1285 603) rotate(-42)">
    <rect x="0" y="0" width="76" height="370" rx="38" fill="#0a0e16" filter="url(#softShadow)"/>
    <rect x="13" y="18" width="50" height="300" rx="25" fill="#202938"/>
    <rect x="19" y="40" width="12" height="240" rx="6" fill="#687386" opacity=".42"/>
  </g>

  <g transform="translate(90 770)">
    <rect width="1420" height="128" rx="28" fill="#0d1830" stroke="#26365b"/>
    <g transform="translate(42 34)">
      <circle cx="28" cy="28" r="28" fill="#1a2d61"/>
      <path d="M19 29l7 7 14-17" fill="none" stroke="#82a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="24" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Source-linked</text>
      <text x="74" y="48" font-family="Arial, sans-serif" font-size="14" fill="#9facbf">Keep context with every lead</text>
    </g>
    <g transform="translate(500 34)">
      <circle cx="28" cy="28" r="28" fill="#1a2d61"/>
      <path d="M18 25h20M18 33h20" stroke="#82a0ff" stroke-width="4" stroke-linecap="round"/>
      <text x="74" y="24" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Visual-first</text>
      <text x="74" y="48" font-family="Arial, sans-serif" font-size="14" fill="#9facbf">Start with a reference photo</text>
    </g>
    <g transform="translate(955 34)">
      <circle cx="28" cy="28" r="28" fill="#1a2d61"/>
      <circle cx="28" cy="22" r="8" fill="none" stroke="#82a0ff" stroke-width="3"/>
      <path d="M15 42c4-14 22-14 26 0" fill="none" stroke="#82a0ff" stroke-width="3" stroke-linecap="round"/>
      <text x="74" y="24" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Human review</text>
      <text x="74" y="48" font-family="Arial, sans-serif" font-size="14" fill="#9facbf">Evidence leads, not conclusions</text>
    </g>
  </g>
</svg>